name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Independent jobs run in parallel. Each restores the shared Gradle cache.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build logic targets JDK 17. Robolectric's SDK 36 sandbox needs JDK 21 to run tests;
      # the last version listed becomes the default.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Screenshot tests run here too but only capture; comparing against the baselines stays a
      # manual step (see the Update screenshots workflow).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  checks:
    name: Build, lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, lint, detekt and formatting
        env:
          # Optional repository secret; without it USDA search falls back to DEMO_KEY.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: ./gradlew assembleDebug lintDebug detekt spotlessCheck --continue --stacktrace

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            build/reports/detekt/
          retention-days: 7

  release:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Catches shrinker problems (missing keep rules) before they reach a release.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

  server:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the PocketBase image
        run: docker build server
