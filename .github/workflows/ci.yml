name: CI

on:
  push:
    branches: [dev, staging, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The build logic targets JDK 17. Robolectric's SDK 36 sandbox needs JDK 21 to run tests;
      # the last version listed becomes the default.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, unit tests, screenshot checks and lint
        env:
          # Optional repository secret; without it USDA search falls back to DEMO_KEY.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test verifyRoborazziDebug lintDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  server:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the PocketBase image
        run: docker build server
