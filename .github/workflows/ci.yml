name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Independent jobs run in parallel. Each restores the shared Gradle cache.
  checks:
    name: Build, lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, detekt and formatting
        env:
          # Optional repository secret; without it USDA search falls back to DEMO_KEY.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: ./gradlew assembleDebug lintDebug detekt spotlessCheck --continue --stacktrace

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            build/reports/detekt/
          retention-days: 7

  release:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # Catches shrinker problems (missing keep rules) before they reach a release.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

  server:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the PocketBase image
        run: docker build server
