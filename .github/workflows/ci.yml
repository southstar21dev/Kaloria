name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, screenshot checks and lint
        env:
          # Optional repository secret; without it USDA search falls back to DEMO_KEY.
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test verifyRoborazziDebug lintDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
