name: Release

on:
  push:
    branches: [master, staging]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check for the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release published: signing secrets are missing. See docs/RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit

      - uses: actions/setup-java@v6
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.signing.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        if: steps.signing.outputs.ready == 'true'
        run: npm ci

      - name: Restore the keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KALORIA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and publish
        if: steps.signing.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KALORIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KALORIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KALORIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: npx semantic-release
