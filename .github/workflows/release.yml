name: Release

# master: a release (v1.2.0). semantic-release picks the version from the commits since the last
# tag; if any warrant one, it builds the signed APKs, tags the commit and publishes a GitHub Release with the changelog and both APKs. Obtainium (and anyone
# else watching the repo's releases) then offers the update.
on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install semantic-release
        run: npm ci

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KALORIA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, tag and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KALORIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KALORIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KALORIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: npx semantic-release

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
