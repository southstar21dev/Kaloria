name: Update screenshots

# Baselines are recorded on Linux because macOS renders glass differently.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Commit changes
        run: |
          git add -- '*/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update screenshot baselines"
          git push

