name: Update screenshots

# Baselines are recorded on Linux because macOS renders glass differently.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Commit changes
        run: |
          git add -- '*/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update screenshot baselines"
          git push

